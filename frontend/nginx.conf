server {
    listen 80;
    server_name _;

    # Docker internal DNS resolver
    # This allows nginx to re-resolve the backend container IP
    # after backend rebuilds/recreates.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # =========================
    # Backend REST API
    # =========================
    location /api/ {
        set $backend_upstream http://backend:8000;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep cookies/auth headers working normally
        proxy_pass_request_headers on;

        # Avoid unnecessarily long hanging requests
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
    }

    # =========================
    # Market WebSocket
    # =========================
    location /ws/ {
        set $backend_upstream http://backend:8000;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    # =========================
    # React / Vite SPA
    # =========================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================
    # Frontend container health
    # =========================
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}